<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="blob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F6D6C9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="blob2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C4B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FCE4D8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B08968"/>
      <stop offset="100%" stop-color="#8C6A52"/>
    </linearGradient>
  </defs>

  <!-- soft translucent blobs, no background rect = fully transparent canvas -->
  <ellipse cx="1000" cy="60" rx="260" ry="150" fill="url(#blob1)"/>
  <ellipse cx="150" cy="220" rx="220" ry="120" fill="url(#blob2)"/>
  <circle cx="1080" cy="200" r="70" fill="#F6D6C9" opacity="0.30"/>
  <circle cx="90" cy="50" r="45" fill="#E8967A" opacity="0.22"/>

  <!-- thin wave line -->
  <path d="M0 190 C 200 150, 400 230, 600 190 S 1000 150, 1200 190"
        fill="none" stroke="#E8C4B8" stroke-width="2" opacity="0.6"/>

  <!-- title -->
  <text x="600" y="115" font-family="Poppins, Segoe UI, sans-serif" font-size="46"
        font-weight="600" fill="url(#textGrad)" text-anchor="middle">
    Hi There! I'm Kartik 👋
  </text>
  <text x="600" y="155" font-family="Poppins, Segoe UI, sans-serif" font-size="19"
        fill="#A9836A" text-anchor="middle">
    AI &amp; Data Science Engineer · ML / DL Explorer
  </text>
</svg>
